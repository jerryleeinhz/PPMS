[runtime]
simulation = true
seed = 1729
sample_name = "SIMULATED_SAMPLE"

[instruments]
reference_frequency_hz = 17.777
series_resistance_ohm = 100000.0
initial_temperature_k = 300.0
initial_field_t = 0.0

[connections]
visa_backend = "default"
visa_timeout_ms = 5000
sr830_address = "SIMULATED::SR830"
sr865a_address = "SIMULATED::SR865A"
gate_top_address = "SIMULATED::KEITHLEY2400_TOP"
gate_bottom_address = "SIMULATED::KEITHLEY2400_BOTTOM"
ppms_host = "127.0.0.1"
ppms_port = 5000

[safety]
source_voltage_min_v = 0.004
source_voltage_max_v = 5.0
source_safe_idle_voltage_v = 0.004
source_frequency_min_hz = 0.001
source_frequency_max_hz = 102000.0
estimated_current_limit_a = 0.00005
field_abs_limit_t = 2.0
field_rate_max_t_per_s = 0.01
field_shutdown_rate_t_per_s = 0.01
temperature_min_k = 1.9
temperature_max_k = 400.0
temperature_rate_max_k_per_min = 5.0
gate_temperature_limit_k = 20.0
gate_voltage_limit_v = 10.0
gate_compliance_limit_a = 1e-8
gate_leakage_limit_a = 1e-9

[acquisition]
averages = 8
sample_interval_s = 0.0
settle_s = 0.0
max_attempts = 3
reference_frequency_tolerance_hz = 0.05
noise_limit_v = 1e-6
temperature_tolerance_k = 0.2
field_tolerance_t = 0.001
source_voltage_tolerance_v = 0.0021
gate_voltage_tolerance_v = 1e-6

[voltage_sweep]
start_voltage_v = 0.004
stop_voltage_v = 0.05
points = 9
target_temperature_k = 300.0
target_field_t = 0.0
temperature_rate_k_per_min = 1.0
field_rate_t_per_s = 0.005
stabilization_timeout_s = 60.0
stability_poll_s = 0.1

[frequency_sweep]
start_frequency_hz = 1.0
stop_frequency_hz = 100.0
points = 7
source_voltage_v = 0.004
target_temperature_k = 300.0
target_field_t = 0.0
temperature_rate_k_per_min = 1.0
field_rate_t_per_s = 0.005
stabilization_timeout_s = 60.0
stability_poll_s = 0.1

[field_sweep]
start_field_t = -1.0
stop_field_t = 1.0
points = 21
source_voltage_v = 0.004
frequency_hz = 17.777
target_temperature_k = 300.0
temperature_rate_k_per_min = 1.0
field_rate_t_per_s = 0.005
stabilization_timeout_s = 60.0
stability_poll_s = 0.1

[temperature_field_sweep]
start_temperature_k = 295.0
stop_temperature_k = 300.0
temperature_points = 2
start_field_t = -0.1
stop_field_t = 0.1
field_points = 3
source_voltage_v = 0.004
frequency_hz = 17.777
temperature_rate_k_per_min = 1.0
field_rate_t_per_s = 0.005
stabilization_timeout_s = 60.0
stability_poll_s = 0.1

[gate_sweep]
# Change to "paired" with equal top/bottom point counts to test a co-sweep line.
mode = "grid"
start_top_gate_v = -1.0
stop_top_gate_v = 1.0
top_gate_points = 3
start_bottom_gate_v = -0.5
stop_bottom_gate_v = 0.5
bottom_gate_points = 2
source_voltage_v = 0.004
frequency_hz = 17.777
target_temperature_k = 10.0
target_field_t = 0.0
temperature_rate_k_per_min = 1.0
field_rate_t_per_s = 0.005
gate_ramp_step_v = 0.25
gate_ramp_step_delay_s = 0.0
gate_settle_s = 0.0
stabilization_timeout_s = 60.0
stability_poll_s = 0.1

[data]
database_path = "../run_data/ppms_control.sqlite"
